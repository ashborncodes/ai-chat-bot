      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#dc2626" stroke-width="8" opacity="0.6"/>
  <!-- Emergency Shield Outline -->
  <path d="M256 64 L400 128 V256 C400 352 336 416 256 448 C176 416 112 352 112 256 V128 Z" fill="#1e293b" stroke="#ef4444" stroke-width="12" stroke-linejoin="round"/>
